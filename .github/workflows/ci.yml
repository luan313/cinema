name: CI
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - name: Compila para Windows
        run: |
          GOOS=windows GOARCH=amd64 go build -o /dev/null ./cmd/cinema
          GOOS=windows GOARCH=amd64 go build -o /dev/null ./cmd/setup
