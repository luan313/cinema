name: Release
# Publica uma release ao criar uma tag, ex.: git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...
      - name: Build (Windows x64)
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist/pkg
          go build -trimpath -ldflags "-s -w -H=windowsgui -X main.version=${GITHUB_REF_NAME}" -o dist/cinema.exe ./cmd/cinema
          go build -trimpath -ldflags "-s -w" -o dist/setup.exe ./cmd/setup
      - name: Empacota
        run: |
          cp dist/setup.exe dist/cinema.exe dist/pkg/
          (cd dist/pkg && zip -9 ../cinema-windows-x64.zip setup.exe cinema.exe)
          (cd dist && sha256sum cinema.exe > SHA256SUMS.txt)
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/cinema-windows-x64.zip
            dist/cinema.exe
            dist/SHA256SUMS.txt
